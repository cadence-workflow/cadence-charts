# Example values for using Cadence with PodMonitoring on GKE with Managed Service for Prometheus
# This configuration enables a single PodMonitoring resource that scrapes metrics from all
# server-deployment pods (frontend, history, matching, worker).

# Enable metrics collection
metrics:
  enabled: true
  port: 9090
  portName: metrics

  # Enable PodMonitoring for GCP Managed Service for Prometheus
  podMonitoring:
    enabled: true
    scrapeInterval: 30s
    timeout: 10s
    # Include Kubernetes metadata in metrics
    # Permitted values: pod, container, node, top_level_controller_name, top_level_controller_type
    # Default: [container, pod, top_level_controller_name, top_level_controller_type]
    # targetLabels:
    #   metadata:
    #     - pod
    #     - container
    #     - node
    # Example metric relabeling to drop unwanted metrics or rename labels
    # metricRelabeling:
    #   - sourceLabels: [__name__]
    #     regex: 'go_.*'
    #     action: drop
