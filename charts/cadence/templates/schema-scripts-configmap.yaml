{{- $dbJobIsHook := and .Values.schema.serverJob.enabled (not (include "cadence.waitForDatabase" .)) -}}
{{- $esJobIsHook := and .Values.schema.elasticSearchJob.enabled (not (include "cadence.waitForElasticsearch" .)) -}}
{{- $needsHook := or $dbJobIsHook $esJobIsHook -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cadence.fullname" . }}-schema-scripts
  {{- if $needsHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
    app.kubernetes.io/component: schema-scripts
data:
{{ (.Files.Glob "files/schema/*.sh").AsConfig | indent 2 }}