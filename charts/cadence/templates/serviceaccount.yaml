{{- if .Values.serviceAccount.create -}}
{{- $dbJobIsHook := and .Values.schema.serverJob.enabled (not (include "cadence.waitForDatabase" .)) -}}
{{- $esJobIsHook := and .Values.schema.elasticSearchJob.enabled (not (include "cadence.waitForElasticsearch" .)) -}}
{{- $needsHook := or $dbJobIsHook $esJobIsHook -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cadence.serviceAccountName" . }}
  {{- if $needsHook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- else }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  labels:
    {{- include "cadence.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}